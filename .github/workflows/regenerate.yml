name: Regenerate the Grammar

on:
  push:
    branches-ignore:
      - "wip*"
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  regenerate:
    name: Regenerate the parser
    # macOS rather than Linux: `tree-sitter generate` for this grammar
    # peaks around 9 GB. macOS's dynamic swap absorbs that (slowly),
    # whereas the Linux runner's OOM-killer terminates it. This job is
    # the sync gate for the committed src/parser.c; the CI workflow only
    # tests it.
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    # Use the pnpm-pinned tree-sitter-cli (not brew's) so generated
    # output is byte-identical to what produced the committed parser;
    # a version skew would make the sync check fail spuriously.
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        package_json_file: package.json
        run_install: false
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: package.json
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install

    - name: Regenerate the parser
      run: pnpm exec tree-sitter generate

    # Gate on parser.c only: it is the build artifact under test and is
    # regenerated whenever grammar.js changes, so it catches real drift.
    # grammar.json / node-types.json are intentionally excluded — the
    # repo's "fix end of files" pre-commit hook appends a trailing
    # newline that `tree-sitter generate` does not emit, which would
    # otherwise fail this check spuriously on every run.
    - name: Check the committed parser is in sync
      run: git diff --exit-code -- src/parser.c

    - name: Generate a patch if out of sync
      if: failure()
      run: |
        git config user.name 'Autogenerated' &&
        git config user.email 'autogenerated@ci' &&
        git add . &&
        git commit -m 'Regenerated' &&
        git format-patch HEAD~ -o regenerated/
    - name: Upload the changes
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: regenerated
        path: regenerated/
