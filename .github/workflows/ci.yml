name: CI

on:
  push:
    branches-ignore:
      - "wip*"
  pull_request:
  schedule:
    # Daily at 1:21
    - cron: '21 1 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  ci:
    name: Test the grammar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tree-sitter/setup-action@49f8c1f20b60102eae8c033bb7c7f6cd056f6086
        with:
          install-lib: false
          # Until tree-sitter generate's performance improvements hit a release
          tree-sitter-ref: 2ef426e10b4fa8189a761025f17548073249c2fc
      - run: tree-sitter generate
      - run: tree-sitter test

      # Gate on parser.c only: it is the build artifact under test and is
      # regenerated whenever grammar.js changes, so it catches real drift.
      # grammar.json / node-types.json are intentionally excluded — the
      # repo's "fix end of files" pre-commit hook appends a trailing
      # newline that `tree-sitter generate` does not emit, which would
      # otherwise fail this check spuriously on every run.
      - name: Check the committed parser is in sync
        run: git diff --exit-code -- src/parser.c

      - name: Generate a patch if out of sync
        if: failure()
        run: |
          git config user.name 'Autogenerated' &&
          git config user.email 'autogenerated@ci' &&
          git add . &&
          git commit -m 'Regenerated' &&
          git format-patch HEAD~ -o regenerated/
      - name: Upload the changes
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regenerated
          path: regenerated/
