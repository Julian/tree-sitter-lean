name: CI

on:
  push:
    branches-ignore:
      - "wip*"
  pull_request:
  schedule:
    # Daily at 1:21
    - cron: '21 1 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  ci:
    name: Test the grammar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: package.json
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install

      # The committed src/parser.c is the build artifact under test.
      # We deliberately do NOT regenerate here: `tree-sitter generate`
      # for this grammar peaks around 9 GB and OOM-kills the Linux
      # runner. Parser/grammar.js sync is enforced separately by the
      # "Regenerate the Grammar" workflow on a swap-tolerant macOS
      # runner.
      - name: Test the grammar
        run: pnpm exec tree-sitter test
